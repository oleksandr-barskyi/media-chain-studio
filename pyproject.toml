[project]
name = "media-chain-studio"
version = "0.1.0"
description = "LangChain + Claude image and video tools: edit a photo by a sentence, caption it, pick a video thumbnail"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "numpy>=1.26",
    "imageio>=2.35",
    "imageio-ffmpeg>=0.5",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
