<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Chain Studio</title>
<style>
  :root { --bg: #0f1420; --card: #182033; --text: #e8edf7; --muted: #9aa6bf; --accent: #5cc8ff; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 1rem/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 60rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
  h1 { font-size: 1.6rem; margin: 0 0 .25rem; }
  p.lead { color: var(--muted); margin: 0 0 1.5rem; }
  section { background: var(--card); border-radius: 1rem; padding: 1.25rem; margin-bottom: 1.25rem; }
  h2 { font-size: 1.1rem; margin: 0 0 .75rem; }
  form { display: grid; gap: .75rem; }
  input[type=text] { padding: .6rem .8rem; border-radius: .6rem; border: 1px solid #2c3854; background: #0f1420; color: var(--text); }
  button { justify-self: start; padding: .6rem 1.2rem; border: 0; border-radius: .6rem; background: var(--accent); color: #002033; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: progress; }
  pre { white-space: pre-wrap; background: #0f1420; padding: .75rem; border-radius: .6rem; font-size: .85rem; }
  img.result { max-width: 100%; border-radius: .6rem; margin-top: .75rem; }
</style>
</head>
<body>
<main>
  <h1>Media Chain Studio</h1>
  <p class="lead">LangChain + Claude: edit a photo with one sentence, caption it, pick a video thumbnail.</p>

  <section>
    <h2>Edit by prompt</h2>
    <form data-endpoint="/api/edit">
      <input type="file" name="image" accept="image/*" required>
      <input type="text" name="instruction" placeholder="Square crop for Instagram, a bit warmer, add 'Summer sale' at the bottom" required>
      <button>Edit</button>
    </form>
    <pre hidden></pre><img class="result" hidden alt="Edited image">
  </section>

  <section>
    <h2>Caption and alt text</h2>
    <form data-endpoint="/api/caption">
      <input type="file" name="image" accept="image/*" required>
      <input type="text" name="language" value="English">
      <button>Caption</button>
    </form>
    <pre hidden></pre><img class="result" hidden alt="">
  </section>

  <section>
    <h2>Video thumbnail</h2>
    <form data-endpoint="/api/video/thumbnail">
      <input type="file" name="video" accept="video/*" required>
      <button>Pick thumbnail</button>
    </form>
    <pre hidden></pre><img class="result" hidden alt="Chosen video frame">
  </section>
</main>
<script>
document.querySelectorAll("form").forEach((form) => {
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const section = form.parentElement;
    const out = section.querySelector("pre");
    const img = section.querySelector("img");
    const button = form.querySelector("button");
    button.disabled = true;
    out.hidden = false;
    out.textContent = "Working";
    img.hidden = true;
    try {
      const res = await fetch(form.dataset.endpoint, { method: "POST", body: new FormData(form) });
      const data = await res.json();
      const { image_png_b64, ...rest } = data;
      out.textContent = JSON.stringify(res.ok ? rest : data, null, 2);
      if (image_png_b64) {
        img.src = "data:image/png;base64," + image_png_b64;
        img.hidden = false;
      }
    } catch (err) {
      out.textContent = String(err);
    } finally {
      button.disabled = false;
    }
  });
});
</script>
</body>
</html>
